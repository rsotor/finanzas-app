name: Versiones

# release-please mantiene abierto un PR «chore: versión X.Y.Z» con el CHANGELOG al día.
# Al mergearlo se crea la etiqueta vX.Y.Z y la versión (Release) en GitHub con sus notas.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # Un PR creado con el token de Actions no lanza la CI por sí solo, y la protección de main la exige.
      # workflow_dispatch sí se puede lanzar con ese token: se pasa la CI a mano a la rama del PR de versión.
      - name: Pasar la CI al PR de versión
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          for rama in $(gh api "repos/$REPO/branches?per_page=100" --jq '.[].name | select(startswith("release-please--"))'); do
            echo "CI para $rama"
            gh workflow run ci.yml --repo "$REPO" --ref "$rama"
          done
