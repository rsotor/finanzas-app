name: Versiones

# release-please mantiene abierto un PR «chore: versión X.Y.Z» con el CHANGELOG al día.
# Al mergearlo se crea la etiqueta vX.Y.Z y la versión (Release) en GitHub con sus notas.
# Su CI queda en pausa hasta que un mantenedor pulsa «Approve workflows and run» en el PR
# (GitHub trata al bot como colaborador externo). Ver CONTRIBUTING.md.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
