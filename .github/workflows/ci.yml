name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Instalar (igual que en docs/instalacion.md)
        run: npm install
      - name: Los lockfiles cuadran con los package.json
        # npm ci falla si no coinciden (npm install los habría arreglado en silencio).
        run: |
          node scripts/npm-en.js webapp/server ci --no-audit --no-fund
          node scripts/npm-en.js webapp/web ci --no-audit --no-fund
      - name: Tests del motor y del servidor
        run: npm test
      - name: Compilar la interfaz
        run: node scripts/npm-en.js webapp/web run build
      - name: La demo arranca y responde
        shell: bash
        run: |
          node scripts/arrancar.js demo --puerto 3456 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3456/salud && break; sleep 1; done
          curl -sf http://127.0.0.1:3456/api/panel | grep -q "Todos los objetivos se pagan"

  interfaz:
    name: Tests de interfaz (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: npm install
      - run: npx playwright install --with-deps chromium
        working-directory: webapp/web
      - run: npm run test:web

  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t finanzas-app .
      - name: El contenedor arranca y responde
        run: |
          docker run -d --name finanzas -p 127.0.0.1:3000:3000 finanzas-app
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3000/salud && break; sleep 1; done
          curl -sf http://127.0.0.1:3000/api/config

  # Único check obligatorio en la regla de main: resume todos los jobs de arriba, así añadir o quitar uno
  # (p. ej. un sistema de la matriz) no obliga a tocar la regla. Ojo: `if: always()` a secas saldría en verde
  # aunque todo fallara; por eso se comprueba el resultado de cada job.
  tests-ok:
    name: tests-ok
    if: always()
    needs: [tests, interfaz, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Todos los jobs en verde
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "::error::Algún job de la CI no ha pasado: ${{ join(needs.*.result, ', ') }}"
          exit 1
      - run: echo "✔ todo en verde"
