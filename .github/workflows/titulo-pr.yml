name: Título del PR

# El CHANGELOG se construye con los títulos de los PR (se mergean con squash: el título es el commit).
# Formato: tipo(ámbito opcional): descripción. Ej.: «feat(plan): banda pesimista en la proyección».
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  # Lo lanza versiones.yml sobre el PR de versión: un PR creado por Actions no dispara pull_request, y si esta
  # comprobación es obligatoria el PR se quedaría bloqueado. Su título lo genera release-please y siempre cumple.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  titulo:
    name: Título del PR
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar el formato
        if: github.event_name == 'pull_request'
        env:
          TITULO: ${{ github.event.pull_request.title }}
        run: |
          if printf '%s' "$TITULO" | grep -qE '^(feat|fix|perf|docs|build|ci|test|refactor|chore|revert)(\([^)]+\))?!?: .+'; then
            echo "✔ $TITULO"
          else
            echo "::error::El título debe empezar por un tipo: feat, fix, perf, docs, build, ci, test, refactor, chore o revert. Ej.: «fix(instalación): npm install en Windows». Ver CONTRIBUTING.md"
            exit 1
          fi
      - name: PR de versión (título generado por release-please)
        if: github.event_name != 'pull_request'
        run: echo "✔ Lanzado sobre la rama del PR de versión; su título lo genera release-please"
